# Render Blueprint for the RFP Proposal Agent.
#
# Using this file: in the Render dashboard, "New +" -> "Blueprint", point it at the git repo
# this file lives in, and Render reads this to create the service. You can also just create a
# plain "Web Service" by hand in the dashboard and copy these same settings in — this file is
# a convenience, not a requirement.
#
# DATABASE: projects, users, and the audit log now live in Postgres on Supabase instead of a
# local SQLite file — set DATABASE_URL below to your Supabase project's connection string
# (Supabase dashboard -> Settings -> Database -> Connection string). That's what makes the app
# safe to run without a persistent disk from the database's point of view: Supabase handles
# backups and survives redeploys on its own.
#
# FILES: uploaded bid invitations and generated proposals are still written to local disk (see
# storage.py / DATA_DIR) — that part did not move. Render's default web service filesystem is
# EPHEMERAL — it is wiped on every deploy and every restart — so the `disk:` block below still
# attaches a persistent disk for those files. Persistent disks require a paid instance type;
# they are NOT available on Render's free plan. If you deploy this on the free plan without the
# disk, every redeploy silently wipes uploaded/generated documents (the database itself is fine
# either way, since it now lives in Supabase). If you'd rather not pay for a disk at all, moving
# document storage to Supabase's Storage buckets is a separate follow-up — ask for it if wanted.
services:
  - type: web
    name: rfp-proposal-agent
    runtime: python
    plan: starter          # smallest plan that supports a persistent disk; free plan cannot use one
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false               # set in the Render dashboard — Supabase's Postgres connection string (contains a password, never commit it to git)
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true       # Render generates and stores a random secret for you
      - key: ADMIN_USERNAME
        sync: false               # set in the Render dashboard, not committed to git
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"     # Render always serves your public URL over HTTPS, so this is safe
    disk:
      name: rfp-agent-data
      mountPath: /var/data
      sizeGB: 1
