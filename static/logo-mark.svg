<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232066"/>
      <stop offset="100%" stop-color="#1D1B4B"/>
    </linearGradient>
  </defs>
  <!-- rounded-square tile, matches the app's existing badge shape language -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#tile)"/>
  <!-- double-chevron mark: two accelerating "forward" strokes — reads as
       "response in motion" (an RFP being turned into a proposal and sent back out).
       Kept to two thick strokes with rounded joins so it stays legible at 16px. -->
  <path d="M31 27 L52 50 L31 73" fill="none" stroke="#8FC6E8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 27 L73 50 L52 73" fill="none" stroke="#D9E92E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
